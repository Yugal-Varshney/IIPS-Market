<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Messages — Campus Market</title>
  <meta name="description" content="Buyer and seller chats on Campus Market." />
  <meta property="og:title" content="Messages — Campus Market" />
  <meta property="og:description" content="Buyer and seller chats on Campus Market." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

  <nav class="navbar">
    <div class="navbar-inner">
      <div class="navbar-left">
        <a href="index.html" class="brand font-display">Campus Market</a>
        <form class="search-form">
          <div class="search-wrap">
            <input type="text" class="search-input" placeholder="Search books, notes, electronics..." aria-label="Search listings" />
            <kbd class="search-kbd font-mono">CMD + K</kbd>
          </div>
        </form>
      </div>
      <div class="navbar-right">
        <a href="wishlist.html" class="icon-link" aria-label="Wishlist">
          <span class="badge-count wishlist-badge-count hidden">0</span>
          <span class="icon-link-label">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.29 1.51 4.04 3 5.5l7 7Z"/></svg>
            <span>Wishlist</span>
          </span>
        </a>
        <a href="add-item.html" class="btn btn-dark">Sell an Item</a>
        <a href="login.html" class="signin-link">Sign in</a>
        <div class="user-menu hidden">
          <button type="button" class="user-avatar">S</button>
          <div class="user-dropdown">
            <p class="user-dropdown-email"></p>
            <a href="wishlist.html" class="user-dropdown-item">My Wishlist</a>
            <a href="messages.html" class="user-dropdown-item">Messages</a>
            <button type="button" class="user-dropdown-item danger sign-out-btn">Sign out</button>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <main>
    <div class="messages-shell">
      <header>
        <h1 class="font-display">MESSAGES</h1>
        <p class="sub font-mono">Buyer ↔ seller chats, on campus only</p>
      </header>

      <div class="messages-grid">
        <aside class="conversation-panel">
          <div class="conversation-list-wrap">
            <div class="conversation-list-header" id="conversation-count">0 conversations</div>
            <ul class="conversation-list" id="conversation-list"></ul>
          </div>
        </aside>

        <section class="chat-panel-col" id="chat-panel-col">
          <div class="chat-placeholder" id="chat-placeholder">
            <h2 class="font-display">PICK A CONVERSATION</h2>
            <p>Your buyer and seller chats show up here. Message a seller from any listing to start one.</p>
          </div>

          <div class="chat-panel hidden" id="chat-panel">
            <header class="chat-panel-header">
              <div style="min-width:0;">
                <h2 class="font-display" id="chat-item-title"></h2>
                <p class="subtitle" id="chat-other-party"></p>
              </div>
              <a href="#" class="view-link font-mono" id="chat-view-listing">View listing</a>
            </header>

            <div class="chat-thread" id="chat-thread"></div>

            <form class="chat-input-row" id="chat-form">
              <input type="text" id="chat-draft" placeholder="Ask about pickup, condition, bargaining…" maxlength="1000" aria-label="Message" />
              <button type="submit" class="btn btn-dark">Send</button>
            </form>
          </div>
        </section>
      </div>
    </div>
  </main>

  <a href="messages.html" class="chat-dock font-display" aria-label="Open messages">CHAT</a>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/supabase-api.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/nav.js"></script>
  <script src="../js/messages.js"></script>
</body>
</html>
