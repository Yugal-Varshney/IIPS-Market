<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign In — Campus Market</title>
  <meta name="description" content="Sign in or register with your college email to buy, sell, and rent on Campus Market." />
  <meta property="og:title" content="Sign In — Campus Market" />
  <meta property="og:description" content="Sign in or register with your college email to use Campus Market." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body data-public="1" >

  <nav class="navbar">
    <div class="navbar-inner">
      <div class="navbar-left">
        <a href="index.html" class="brand font-display">Campus Market</a>
      </div>
      <!-- <div class="navbar-right">
        <a href="index.html" class="signin-link">Back to board</a>
      </div> -->
    </div>
  </nav>

  <main>
    <div class="auth-shell">
      <h1 class="font-display">NEW PASSWORD</h1>
      <p class="lead">Open this page from the link in your reset email, then choose a new password.</p>
      <form id="reset-form" class="auth-form">
        <div>
          <label class="field-label">New Password</label>
          <input type="password" id="reset-password" class="field-input" placeholder="At least 6 characters" maxlength="72" />
        </div>
        <p id="reset-error" class="error-box hidden"></p>
        <button type="submit" class="btn btn-primary" id="reset-submit" style="width:100%;">SAVE PASSWORD</button>
      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/supabase-api.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/nav.js"></script>
  <script src="../js/reset.js"></script>
</body>
</html>
